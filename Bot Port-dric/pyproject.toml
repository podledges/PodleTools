[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bot-portdric"
version = "0.1.0"
description = "Minimal loopback hello/ack transport for local tools"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
bot-portdric = "bot_portdric.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
