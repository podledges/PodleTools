[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "podlemale"
version = "0.1.0"
description = "Nix TX loopback hook for the Port NixVM v1 duplex"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
podlemale = "podlemale.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
